<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Точки (узлы) -->
    <circle cx="50" cy="50" r="6" fill="#4f46e5"/>
    <circle cx="100" cy="40" r="6" fill="#4f46e5"/>
    <circle cx="150" cy="70" r="6" fill="#4f46e5"/>
    <circle cx="90" cy="100" r="6" fill="#4f46e5"/>
    <circle cx="130" cy="140" r="6" fill="#4f46e5"/>

    <!-- Линии (связи между узлами) -->
    <line x1="50" y1="50" x2="100" y2="40" stroke="#4f46e5" stroke-width="2" />
    <line x1="100" y1="40" x2="150" y2="70" stroke="#4f46e5" stroke-width="2" />
    <line x1="100" y1="40" x2="90" y2="100" stroke="#4f46e5" stroke-width="2" />
    <line x1="90" y1="100" x2="130" y2="140" stroke="#4f46e5" stroke-width="2" />

    <!-- Эффект активности (анимированная точка) -->
    <circle cx="150" cy="70" r="3" fill="#fff">
        <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
</svg>